name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build libboost-dev nlohmann-json3-dev libgtest-dev clang-format

      - name: Check C++ formatting
        run: |
          clang-format --dry-run --Werror \
            src/Source.cpp \
            src/*/*.h src/*/*.cpp \
            tests/*.cpp

      - name: Build and run Release tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCSE_BUILD_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Build and run ThreadSanitizer tests
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCSE_BUILD_TESTS=ON -DCSE_ENABLE_TSAN=ON
          cmake --build build-tsan --parallel
          ctest --test-dir build-tsan --output-on-failure

      - name: Check Python scripts syntax
        run: |
          python3 -m py_compile search scripts/download_dataset.py bench/bench_index.py bench/bench_search.py
